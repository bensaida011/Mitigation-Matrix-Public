name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal dependencies
        # Only the runtime deps the suite actually imports — proves the tests
        # need no pwntools, capstone, docker, or a C compiler toolchain.
        run: python -m pip install click rich jinja2 pytest
      - name: Run tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true  # lint is advisory, never blocks CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check src tests
